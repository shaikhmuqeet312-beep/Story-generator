<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All in One Story Generator</title><style>body{font-family:Arial;background:#f2f2ff;padding:15px}.box{max-width:700px;margin:auto;background:white;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.2)}h1{text-align:center;color:#6d28d9}input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:14px;background:#6d28d9;color:white;border:0;border-radius:10px;font-size:18px;font-weight:bold}#out{margin-top:15px;background:#fafafa;padding:15px;border-radius:10px;white-space:pre-wrap;min-height:200px;border:1px dashed #999}</style></head><body><div class="box"><h1>📚 Story Generator</h1><input id="topic" placeholder="Topic: Billi chand pe gayi"><select id="cat"><option>Kids Story</option><option>Horror</option><option>Funny</option><option>Moral Story</option><option>Islamic</option><option>YouTube Story</option></select><select id="lang"><option>Roman Urdu</option><option>Urdu</option><option>English</option></select><button onclick="gen()">Generate Story ✨</button><div id="out">Story yahan ayegi...</div><button onclick="copyT()" style="background:#10b981;margin-top:10px">Copy Karo</button></div><script>function gen(){let t=document.getElementById('topic').value||'Ek bahadur larka';let c=document.getElementById('cat').value;let l=document.getElementById('lang').value;let s=`Topic: ${t}\nCategory: ${c}\n\n`;if(l=='Roman Urdu'){s+=`Ek dafa ka zikr hai ke ${t} bohot mashhoor tha. Wo hamesha dusro ki madad karta tha.\n\nEk din usko ek bari mushkil ka samna karna para. Sab ne kaha ye namumkin hai. Lekin ${t} ne himmat nahi haari.\n\nAakhir me usne apni aqal se masla hal kar liya. Sab khush ho gaye. Sabaq: Himmat kabhi nahi harni chahiye.`;}else if(l=='Urdu'){s+=`ایک دفعہ کا ذکر ہے کہ ${t} ایک نیک دل تھا۔ وہ ہمیشہ سچ بولتا تھا۔\n\nایک دن اسے ایک مشکل پیش آئی۔ لیکن اس نے ہمت نہ ہاری۔\n\nآخر میں کامیابی اسی کو ملی۔ سبق: سچائی اور محنت کا پھل میٹھا ہوتا ہے۔`;}else{s+=`Once upon a time, ${t} was a kind hero. This is a ${c}.\n\nOne day a big problem came. Everyone was scared. But ${t} used courage and wisdom.\n\nIn the end, ${t} won and everyone learned: Honesty and hard work always wins. The End.`;}document.getElementById('out').innerText=s;}function copyT(){navigator.clipboard.writeText(document.getElementById('out').innerText);alert('Copied!');}</script></body></html>
