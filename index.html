 <!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Story Generator - White</title><style>body{background:#ffffff;color:#000;font-family:Arial;padding:0;margin:0}.header{background:#fff;padding:15px;text-align:center;border-bottom:1px solid #e5e5e5;position:sticky;top:0}.header h1{margin:0;color:#000;font-size:22px}.box{max-width:800px;margin:auto;padding:15px}input,select{width:100%;padding:14px;margin:6px 0;border-radius:8px;border:1px solid #d1d1d1;background:#fff;color:#000;font-size:16px;box-sizing:border-box}.btn{width:100%;padding:14px;border-radius:8px;border:0;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}.gen{background:#000;color:#fff}.copy{background:#fff;color:#000;border:1px solid #d1d1d1}.imgbtn{background:#fff;color:#000;border:1px solid #d1d1d1}.vidbtn{background:#fff;color:#000;border:1px solid #d1d1d1}#out,#imgout,#vidout{background:#f7f7f8;padding:15px;border-radius:8px;white-space:pre-wrap;line-height:1.7;margin-top:8px;min-height:180px;border:1px solid #e5e5e5;color:#000;font-size:14px}.label{font-weight:bold;margin-top:20px;display:block;color:#000}</style></head><body><div class='header'><h1>💬 Story Generator</h1></div><div class='box'><input id='t' placeholder='Message Story Generator... (e.g. CIA agent in Karachi)'><select id='c'><option selected>Hollywood Action Horror</option><option>Action</option><option>Zombie Action</option><option>Horror</option></select><button class='btn gen' onclick='gen()'>↑ Generate</button><span class='label'>📖 Story</span><div id='out'>Yahan story ayegi...</div><button class='btn copy' onclick='copyText("out")'>📋 Copy Story</button><button class='btn copy' onclick='cutText()'>✂️ Cut / Clear</button><span class='label'>🎨 Image Prompts</span><div id='imgout'>Image prompts yahan...</div><button class='btn imgbtn' onclick='copyText("imgout")'>🎨 Copy Image Prompts</button><span class='label'>🎥 Video Prompts</span><div id='vidout'>Video prompts yahan...</div><button class='btn vidbtn' onclick='copyText("vidout")'>🎥 Copy Video Prompts</button></div><script>
function gen(){let t=document.getElementById('t').value||'CIA agent';let n=t.split(' ')[0];if(n.length<3)n='Jack';let s=`TITLE: ${t.toUpperCase()} - 8 SCENE MOVIE\n\nSCENE 1 - KARACHI BARISH\nKarachi barish. ${n} chai dukan. Radio: Lyari jungle me 3 lashain. Phone: "${n} wo jaag gaya!"\n\nSCENE 2 - FLASHBACK\nCIA lab Afghanistan. Bache pe experiment. ${n} ne blast kiya. Bacha Viktor bana 7 foot.\n\nSCENE 3 - JUNGLE\nTorch leke jungle. Sara journalist milti. 7 foot saya laal aankhein.\n\nSCENE 4 - FIGHT\nViktor hamla. Goli bekar. Haath se ladai. Sara rod marti.\n\nSCENE 5 - DARGAH\nBaba: "Jinn nahi science ka azab. Remote Clifton tower me."\n\nSCENE 6 - TOWER\nToofan me tower. General: "Super soldier banaya." Sara LIVE.\n\nSCENE 7 - CLIMAX\nAkhri ladai. ${n}: "Tu bacha tha!" Viktor yaad aya. General pe hamla. Remote blast!\n\nSCENE 8 - SUBAH\nHospital. ${n} zinda. TV: Project Exposed. Lamba saya neeli aankhein leke ja raha.\n\nTHE END...`;let img=`IMAGE PROMPTS for ${t}\n1. Rainy Karachi night chai dhaba ${n} sitting alone cinematic 8k --ar 16:9\n2. Secret CIA lab experiment red lights horror --ar 16:9\n3. Dark jungle torch journalist scared monster red eyes fog --ar 16:9\n4. Fight ${n} vs monster black blood action --ar 16:9\n5. Old dargah baba mystical --ar 16:9\n6. Clifton tower storm general remote lightning --ar 16:9\n7. Tower blast explosion Hollywood --ar 16:9\n8. Hospital morning monster blue eyes --ar 16:9`;let vid=`VIDEO PROMPTS for ${t}\n1. Heavy rain Karachi night push in 5s\n2. Lab explosion transforming 5s\n3. Jungle fog monster jump scare 5s\n4. Combat slow motion blood 6s\n5. Dargah dust candle 4s\n6. Tower climbing storm 5s\n7. Final explosion collapsing 7s\n8. Hospital sunrise emotional 5s`;document.getElementById('out').innerText=s;document.getElementById('imgout').innerText=img;document.getElementById('vidout').innerText=vid;}function copyText(id){let txt=document.getElementById(id).innerText;navigator.clipboard.writeText(txt).then(()=>{alert('Copy Ho Gaya! ✅')});}function cutText(){document.getElementById('out').innerText='Cleared...';document.getElementById('imgout').innerText='Cleared...';document.getElementById('vidout').innerText='Cleared...';}
</script></body></html>
