<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PRO Hollywood</title><style>body{font-family:Arial;background:#0f0f1a;color:#fff;padding:12px}.box{max-width:700px;margin:auto;background:#1e1e30;padding:20px;border-radius:16px}h1{text-align:center;color:#a78bfa}input,select{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:0;background:#2a2a44;color:#fff}button{width:100%;padding:15px;background:#7c3aed;color:white;border:0;border-radius:12px;font-size:18px;font-weight:bold}#out{margin-top:15px;background:#111;padding:15px;border-radius:12px;white-space:pre-wrap;min-height:300px}</style></head><body><div class="box"><h1>🎬 Hollywood PRO</h1><input id="t" placeholder="Topic likho: CIA agent"><select id="c"><option>Action</option><option selected>Hollywood Action Horror</option><option>Action Thriller</option><option>Horror</option><option>Kids Story</option><option>Funny</option></select><select id="l"><option>Roman Urdu</option><option>English</option></select><button onclick="g()">Generate ✨</button><div id="out">Story yahan ayegi...</div></div><script>function g(){let t=document.getElementById('t').value||"Agent";let c=document.getElementById('c').value;let s=`[${c} - ${t.toUpperCase()}]\n\nSCENE 1 - NIGHT. RAIN.\nJack ${t} - ex Special Forces. Radio pe: '3 log lapata'. Jack shotgun leke jungle ki taraf.\n\nSCENE 2 - HAUNTING\nAndhera, darakht hil rahe hain. Torch band. Peeche hasne ki awaz. Khooni haath!\n\nSCENE 3 - FULL ACTION\n7 foot ka saya, laal aankhein. Jack bhaagta nahi. Fire! Blast! Monster pe petrol daal ke aag laga di.\n\nSCENE 4 - TWIST\nSubah police aayi, koi laash nahi. Sirf khoon. Kya monster tha ya weham? Aakhir me Jack ki aankhein laal.\n\n[THE END]`;document.getElementById('out').innerText=s}</script></body></html>
