<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hollywood PRO</title><style>body{background:#0f0f1a;color:#fff;font-family:Arial;padding:12px}.box{max-width:700px;margin:auto;background:#1e1e30;padding:20px;border-radius:16px}h1{color:#a78bfa;text-align:center}input,select{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:0;background:#2a2a44;color:#fff}button{width:100%;padding:15px;background:#7c3aed;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold}#out{margin-top:15px;background:#111;padding:15px;border-radius:12px;white-space:pre-wrap;min-height:300px}</style></head><body><div class="box"><h1>🎬 Hollywood PRO</h1><input id="t" placeholder="Topic: CIA agent"><select id="c"><option>Action</option><option selected>Hollywood Action Horror</option><option>Action Thriller</option><option>Horror</option><option>Kids</option><option>Funny</option></select><select id="l"><option>Roman Urdu</option><option>English</option></select><button onclick="gen()">Generate ✨</button><div id="out">Story yahan ayegi...</div></div><script>function gen(){let t=document.getElementById('t').value||'Agent';let c=document.getElementById('c').value;document.getElementById('out').innerText=`[${c} - ${t}]\n\nSCENE 1 - RAIN\nJack ${t} ex-Forces. Radio: 3 log lapata. Jungle taraf.\n\nSCENE 2 - HAUNTING\nTorch band. Khooni haath.\n\nSCENE 3 - ACTION\n7 foot saya, laal aankhein. Fire! Blast! Aag!\n\nSCENE 4 - TWIST\nSubah koi laash nahi. Jack ki aankhein laal.\n[THE END]`}</script></body></html>
