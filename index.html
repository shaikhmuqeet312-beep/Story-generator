<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>Real Story V4</title><style>body{background:#fff;color:#000;font-family:Arial;padding:15px;margin:0}.box{max-width:850px;margin:auto}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:16px}button{width:100%;padding:14px;background:#000;color:#fff;border-radius:8px;border:0;font-weight:bold;margin:8px 0;font-size:16px}#out,#imgout,#vidout{background:#f7f7f8;padding:15px;border-radius:8px;white-space:pre-wrap;line-height:1.8;margin-top:10px;border:1px solid #e5e5e5;min-height:150px}</style></head><body><div class='box'><h2>🎬 Real Story Generator V5</h2><input id='t' placeholder='Topic: CIA agent in Karachi jungle'><button onclick='gen()'>Generate Real Story</button><div id='out'>Yahan behtareen story ayegi...</div><button onclick='copyText("out")' style='background:#eee;color:#000;border:1px solid #ccc'>📋 Copy Story</button><div id='imgout' style='margin-top:15px'>Image prompts...</div><button onclick='copyText("imgout")' style='background:#eee;color:#000;border:1px solid #ccc'>🎨 Copy Image</button><div id='vidout' style='margin-top:15px'>Video prompts...</div><button onclick='copyText("vidout")' style='background:#eee;color:#000;border:1px solid #ccc'>🎥 Copy Video</button></div><script>function gen(){let t=document.getElementById('t').value||'CIA Agent in Karachi';let hero='Rayyan Khan';let h='Sara';let v='Viktor';let s="TITLE: "+t.toUpperCase()+" - HOLLYWOOD MUSLIM COUNTRY THRILLER\n\nSCENE 1 - KARACHI BARISH:\nKarachi me tez barish, Maghrib ka waqt. "+hero+" Clifton ke chai dhabe pe baitha hai. Radio pe: Lyari jungle me 3 lashain mili. Uska purana phone bajta hai: Wo Project jaag gaya hai, tumhe dhoondh raha hai.\n\nSCENE 2 - FLASHBACK:\n2 Saal Pehle Afghanistan Border. CIA ka secret lab PROJECT ABADDON. Masoom bachon pe experiment. "+hero+" ISI agent tha, usne reham kha ke lab ko blast kar diya. Sab samjhe sab khatam. Lekin ek bacha "+v+" zinda bacha, 7 foot ka monster ban gaya.\n\nSCENE 3 - JUNGLE:\n"+hero+" torch leke Lyari jungle me dakhil hota. Wahan journalist "+h+" milti jo case cover kar rahi thi. Achanak zameen hilti, bargad ka darakht girta, andhere me 2 laal aankhein chamakti, 7 foot ka "+v+" samne.\n\nSCENE 4 - FIGHT:\n"+v+" dahad ke hamla karta. "+hero+" goli chalata, goli paar ho jati par zakham se kaala khoon. Haath se ladai. "+hero+" deewar pe lagta. "+h+" lohe ki rod utha ke "+v+" ke sir pe marti, dono bhaagte.\n\nSCENE 5 - DARGAH:\nJungle ke beech purani Sufi dargah. Buzurg Baba kehte: Beta ye jinn nahi science ka azab hai. Iske gale me chip hai, asli remote Clifton ke American Tower me hai. Usse todna hoga.\n\nSCENE 6 - TOWER:\nToofan me Clifton Tower. Upar American General: Welcome "+hero+"! Tumne mera super soldier tabah kiya tha. Dekho "+v+" ab mera ghulam hai. "+h+" chupke se sab LIVE record karti.\n\nSCENE 7 - CLIMAX:\nBijli kadak rahi. "+hero+" chillata: "+v+"! Tu wohi bacha hai! Allah ne tujhe insaan banaya, shaitan nahi! Yaad karo! "+v+" ki aankhon me aansu, usse bachpan yaad aata. Wo palat ke General pe hamla karta. "+hero+" remote pe goli marta - ZORDAAR DHAMAKA!\n\nSCENE 8 - SUBAH:\nSubah Fajr ki azan. "+hero+" hospital bed pe. TV pe "+h+" ki news: Project Exposed! Nurse: Aapke sath jo lamba admi tha? "+hero+" khidki se dekhta - "+v+" neeli aankhon se muskurata hua Karachi ki bheed me ja raha.\n\nTHE END - Moral: Taqat jab had paar kare to azab banti.";document.getElementById('out').innerText=s;document.getElementById('imgout').innerText="IMAGE PROMPTS for "+t+"\n1 Rainy Karachi chai dhaba "+hero+" cinematic --ar 16:9\n2 Secret CIA lab experiment red lights horror --ar 16:9\n3 Dark jungle torch journalist scared monster red eyes fog --ar 16:9\n4 Fight hero vs 7ft monster black blood rain action --ar 16:9\n5 Old Sufi dargah Pakistan mystical baba light --ar 16:9\n6 Clifton tower thunderstorm general with remote --ar 16:9\n7 Tower blast explosion climax epic --ar 16:9\n8 Morning hospital sunrise monster blue eyes walking away";document.getElementById('vidout').innerText="VIDEO PROMPTS for "+t+"\n1 Heavy rain push in chai dhaba 5s\n2 Lab blast transforming 5s\n3 Jungle fog jump scare 5s\n4 Combat slow motion 6s\n5 Dargah candle dust 4s\n6 Tower climbing storm 5s\n7 Explosion collapsing 7s\n8 Sunrise emotional walk 5s";}function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert('Copy Ho Gaya ✅'))}</script></body></html>
