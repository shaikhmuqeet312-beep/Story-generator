<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Story Generator V4 - Real Story</title><style>body{background:#fff;color:#000;font-family:Arial;padding:0;margin:0}.h{background:#fff;padding:15px;text-align:center;border-bottom:1px solid #e5e5e5;position:sticky;top:0}.h h1{margin:0}.box{max-width:850px;margin:auto;padding:15px}input,select{width:100%;padding:14px;margin:6px 0;border-radius:8px;border:1px solid #ccc;background:#fff;color:#000;box-sizing:border-box;font-size:16px}.btn{width:100%;padding:14px;border-radius:8px;border:0;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}.gen{background:#000;color:#fff}.copy{background:#f1f1f1;color:#000;border:1px solid #ccc}#out,#imgout,#vidout{background:#f7f7f8;padding:15px;border-radius:8px;white-space:pre-wrap;line-height:1.8;margin-top:8px;border:1px solid #e5e5e5;font-size:14px;min-height:180px}.label{font-weight:bold;margin-top:18px;display:block}</style></head><body><div class='h'><h1>🎬 Real Story Generator V4</h1></div><div class='box'><input id='t' placeholder='Topic likho: e.g. CIA agent in Karachi, Zombie in Lahore'><select id='g'><option>Hollywood Action Horror - Muslim Country</option><option>Action</option><option>Horror</option><option>Zombie</option></select><button class='btn gen' onclick='gen()'>Generate Real Story</button><span class='label'>📖 Full Realistic Story</span><div id='out'>Yahan behtareen story ayegi...</div><button class='btn copy' onclick='copyText("out")'>📋 Story Copy</button><button class='btn copy' onclick='cutText()'>✂️ Clear</button><span class='label'>🎨 Image Prompts (8 Scenes)</span><div id='imgout'>...</div><button class='btn copy' onclick='copyText("imgout")'>🎨 Copy Image Prompts</button><span class='label'>🎥 Video Prompts</span><div id='vidout'>...</div><button class='btn copy' onclick='copyText("vidout")'>🎥 Copy Video Prompts</button></div><script>
function gen(){
let topic = document.getElementById('t').value || 'CIA Agent in Karachi';
let hero = 'Rayyan Khan';
let heroine = 'Sara';
let villain = 'Viktor';
if(topic.toLowerCase().includes('girl') || topic.toLowerCase().includes('larki')){ hero = 'Zoya'; }

let story = `TITLE: ${topic.toUpperCase()} - A HOLLYWOOD STYLE MUSLIM COUNTRY THRILLER

MAIN CHARACTERS:
- Hero: ${hero} (Ex-ISI, ab Karachi me rehta hai, Allah pe yaqeen)
- Heroine: ${heroine} (Investigative Journalist, Bol TV)
- Villain: ${villain} (Russian-American Super Soldier)

SCENE 1 - KARACHI KI TOOFANI RAAT [INTRODUCTION]
Karachi me tez barish ho rahi hai, Azan-e-Maghrib ka waqt. ${hero} Clifton ke ek chote se chai dhabe pe baitha hai. Uske samne radio chal raha hai: "Breaking News - Lyari ke qareeb jungle se 3 jawan larkon ki lashain mili hain, unki aankhein nikli hui thi aur chehre pe khof tha." ${hero} ka purana zakhmi dil kaanp uthta hai. Tabhi uska purana encrypted mobile bajta hai, dusri taraf se uska ustad Colonel Jameel kehta hai: "${hero}, woh project jo humne 2 saal pehle Afghanistan me dafan kiya tha... woh jaag gaya hai. Woh tumhe dhoondh raha hai."

SCENE 2 - FLASHBACK - THE SIN OF THE PAST [BACKSTORY]
2 Saal Pehle, Afghanistan Border. CIA ka ek kala secret lab, jiska naam tha PROJECT ABADDON. Wahan Russian aur American scientists yateem Muslim bachon pe illegal experiment kar rahe the - unhe dard mehsoos na ho, aisa super soldier banana. ${hero} us waqt ISI ke liye kaam karta tha, usne dekha ek 10 saal ke bache pe zulm ho raha tha. Reham kha ke ${hero} ne lab ko dhamake se uda diya. Sab ne socha sab khatam ho gaya. Lekin woh bacha mara nahi, balke us experiment ne usko 7 foot ka, dard se mehroom, khoonkhar monster bana diya. Uska naam tha ${villain}.

SCENE 3 - THE JUNGLE OF DEATH [FIRST ENCOUNTER]
${hero} apni purani pistol aur torch leke Lyari ke us khaufnaak jungle me dakhil hota hai, jahan police bhi jaane se darti hai. Wahan use ${heroine} milti hai, jo is case ko cover kar rahi thi. "Tum yahan kya kar rahe ho?" ${heroine} poochti hai. Tabhi achanak 100 saal purana bargad ka darakht zameen pe gir jata hai. Samne ghup andhere me do laal angaaron jaisi aankhein jalti hain. Zameen hilne lagti hai. 7 foot ka ${villain} saamne aata hai, uske jism se kaala dhuan nikal raha hai.

SCENE 4 - THE FIRST FIGHT [ACTION]
${villain} zor se dahadta hai aur ${hero} pe hamla karta hai. ${hero} goli chalata hai, goli ${villain} ke seene se aar paar ho jati hai lekin usko kuch nahi hota, woh hansne lagta hai aur uske zakham se kaala khoon nikalta hai. Haath se haath ki ladai shuru hoti hai. ${hero} ek trained soldier hai lekin ${villain} ki taqat insani nahi. ${hero} deewar pe ja lagta hai. Tabhi ${heroine} himmat karke zameen pe padi lohe ki rod utha ke ${villain} ke sir pe marti hai. ${villain} ek lamhe ke liye behosh hota hai aur woh dono wahan se bhaagte hain.

SCENE 5 - THE SAINT'S WARNING [THE TWIST - MUSLIM TOUCH]
Woh dono bhaag ke jungle ke beech ek purani Sufi dargah me panah lete hain. Wahan ek buzurg Baba rehte hain. Baba kehte hain: "Beta, ye koi jinn ya bhoot nahi hai. Ye insaan ke ghuroor aur science ka azab hai. Iske gale me ek chip hai jo iske dimaag ko control karti hai. Iska asal remote Clifton ke us naye American Tower me hai jahan se ye sab control ho raha hai. Us remote ko todna hoga, warna ye poora Karachi khatam kar dega." Baba dua dete hain.

SCENE 6 - CLIFTON TOWER - THE DEN OF EVIL [INFILTRATION]
Toofani raat me ${hero} aur ${heroine} Clifton ke sabse unche tower pe chadhte hain. Upar ek sheeshe ke kamre me American General Smith baitha hai, uske haath me remote. General hasta hai: "Welcome ${hero}! Tumne 2 saal pehle mera sabse keemti hathyaar tabah kiya tha. Ab dekho, ${villain} meri wajah se zinda hai. Main Pakistan jaisi Muslim countries me aise hazaron super soldiers banana chahta hoon." ${heroine} chupke se apne mobile se sab kuch LIVE record karna shuru kar deti hai.

SCENE 7 - THE FINAL CLIMAX [QURBANI & ACTION]
Bijli kadak rahi hai. Akhri ladai shuru hoti hai. General ${villain} ko hukam deta hai ke ${hero} ko maar de. Lekin ${hero} chillata hai: "${villain}! Yaad karo! Tum wohi bache ho! Main tumhe bachane aaya tha! Allah ne tumhe insaan banaya hai, shaitan nahi!" ${villain} ke andar ka woh 10 saal ka bacha jaag uthta hai, uski laal aankhon me aansu aate hain. Woh palat ke General pe hamla karta hai. Isi mauke pe ${hero} remote pe goli marta hai. ZORDAAR DHAMAKA! Poora tower hil jata hai.

SCENE 8 - THE NEW DAWN [REALISTIC ENDING]
Subah ho chuki hai. Karachi ki masjidon se Fajr ki azan aa rahi hai. ${hero} hospital ke bed pe hai, halke zakhmi. TV pe ${heroine} ki news chal rahi hai: "Bol TV Exclusive - American Secret Project Exposed by Pakistani Journalist!" Saari duniya me tahalqa mach gaya hai. Nurse aati hai: "Aapke saath jo lambe qad wala aadmi tha, woh kahan hai?" ${hero} khidki se bahar dekhta hai. Door sadak pe ${villain} ja raha hai, ab uski aankhein laal nahi, neeli hain, pur-sukoon. Woh ek dafa palat ke muskurata hai aur phir Karachi ki bheed me ghum ho jata hai.

THE END - Lekin kya ye khatam hua? Part 2 me dekhenge ${villain} ka kya hoga.

MORAL: Taqat jab Allah ki hudood paar kare to azab ban jati hai.
`;

let img = `REALISTIC IMAGE PROMPTS for: ${topic} - Muslim Country Style

1. Heavy rain night in Karachi Pakistan, chai dhaba, hero ${hero} bearded Pakistani man sitting alone worried, cinematic dark moody, realistic --ar 16:9
2. Secret CIA lab Afghanistan border, illegal experiment on child, dark sci-fi horror, realistic lighting --ar 16:9
3. Dark dangerous jungle Lyari Karachi, Pakistani journalist ${heroine} with camera scared, 7 foot monster with red eyes foggy night --ar 16:9
4. Intense hand to hand fight Pakistani hero vs 7 foot monster, black blood, rain action cinematic realistic --ar 16:9
5. Old Sufi dargah Pakistan at night, old baba saint with tasbih, spiritual light, mystical --ar 16:9
6. Top of modern Clifton tower Karachi in thunderstorm, American general in suit with remote, lightning --ar 16:9
7. Climax explosion on tower top, hero and monster fighting general, epic blast cinematic --ar 16:9
8. Morning Karachi hospital, hero in bed, Fajr azan time, monster walking away peacefully blue eyes --ar 16:9`;

let vid = `VIDEO PROMPTS for ${topic}

1. Slow push in shot heavy rain Karachi chai shop at Maghrib time, worried man, radio news 5s
2. Flashback montage CIA secret lab blast child transforming shaky cam 5s
3. POV torch walking in Lyari jungle fog sudden monster red eyes jump scare 5s
4. Action fight Pakistani hero vs monster slow motion black blood 6s
5. Old dargah saint speaking dua dust particles candle lights 4s
6. Climbing Clifton tower thunderstorm general laughing with remote 5s
7. Final fight tower explosion tower collapsing hero jumping epic 7s
8. Morning hospital sunrise azan hero looking window monster walking away emotional 5s`;

document.getElementById('out').innerText = story;
document.getElementById('imgout').innerText = img;
document.getElementById('vidout').innerText = vid;
}
function copyText(id){let t=document.getElementById(id).innerText;navigator.clipboard.writeText(t).then(()=>alert('Copy Ho Gaya! ✅'));}
function cutText(){document.getElementById('out').innerText='Cleared...';document.getElementById('imgout').innerText='Cleared...';document.getElementById('vidout').innerText='Cleared...';}
</script></body></html>
